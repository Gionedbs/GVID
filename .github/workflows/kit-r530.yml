# Compila il video server su Windows e produce kit-R530.zip, pronto da copiare sulla macchina di prova.
# Parte a ogni push su main e a mano da Actions > "Kit R530" > Run workflow.
name: Kit R530

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SQLITE_URL: https://www.sqlite.org/2026/sqlite-amalgamation-3540100.zip
  FFMPEG_BRANCH: release/9.0

jobs:
  kit:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: SQLite
        run: |
          Invoke-WebRequest $env:SQLITE_URL -OutFile sqlite.zip
          Expand-Archive sqlite.zip -DestinationPath sqlite-src
          $dir = (Get-ChildItem sqlite-src -Directory | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force vserver/third_party/sqlite | Out-Null
          Copy-Item "$dir/sqlite3.c", "$dir/sqlite3.h" vserver/third_party/sqlite/

      - name: Sorgenti FFmpeg 9.0
        run: |
          git clone --depth 1 --branch $env:FFMPEG_BRANCH https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          $sha = git -C ffmpeg-src rev-parse HEAD
          "FFMPEG_SHA=$sha" | Out-File -Append $env:GITHUB_ENV
          "FFMPEG_ROOT=$($env:GITHUB_WORKSPACE -replace '\\', '/')/ffmpeg-msvc" | Out-File -Append $env:GITHUB_ENV

      - name: FFmpeg gia' compilato
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ffmpeg-msvc
          key: ffmpeg-msvc-${{ env.FFMPEG_SHA }}-${{ hashFiles('vserver/tools/build-ffmpeg.sh') }}

      - name: Compilazione FFmpeg con Visual Studio
        if: steps.ffcache.outputs.cache-hit != 'true'
        shell: cmd
        env:
          MSYS2_PATH_TYPE: inherit
          CHERE_INVOKING: '1'
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed make diffutils nasm" || exit /b 1
          C:\msys64\usr\bin\bash.exe -lc "bash ./vserver/tools/build-ffmpeg.sh '%GITHUB_WORKSPACE%\ffmpeg-src' '%GITHUB_WORKSPACE%\ffmpeg-msvc'" || exit /b 1

      - name: Compilazione
        run: |
          cmake -S vserver -B build -A x64 -DFFMPEG_ROOT="$env:FFMPEG_ROOT"
          cmake --build build --config Release --parallel

      - name: Test di base
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Composizione del kit
        run: |
          $k = 'kit-R530'
          New-Item -ItemType Directory -Force "$k/bin" | Out-Null
          Copy-Item vserver/kit/* $k
          foreach ($f in 'core_tests.exe', 'record_smoke.exe', 'play_smoke.exe', 'flow_smoke.exe') {
            Copy-Item "build/Release/$f" "$k/bin"
          }
          Copy-Item build/Release/*.dll "$k/bin"
          Copy-Item ffmpeg-src/COPYING.LGPLv2.1 "$k/bin/FFmpeg-LICENSE.txt"
          "FFmpeg $env:FFMPEG_BRANCH, commit $env:FFMPEG_SHA, compilato con vserver/tools/build-ffmpeg.sh" | Out-File "$k/bin/FFmpeg-VERSIONE.txt"
          Get-ChildItem $k -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Compatibilita' con Windows 10 1607 / Server 2016
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          # Funzioni che su 1607 non sono esportate da KERNEL32 (o non esistono ancora).
          $vietate = 'SetThreadDescription', 'GetThreadDescription', 'VirtualAlloc2', 'MapViewOfFile3', 'ProcessPrng'
          $problemi = foreach ($f in Get-ChildItem kit-R530/bin/*.dll, kit-R530/bin/*.exe) {
            & $dumpbin.FullName /nologo /imports $f.FullName | Where-Object { $_ -match '^\s+[0-9A-Fa-f]+\s+(\S+)\s*$' -and $vietate -contains $Matches[1] } | ForEach-Object { "$($f.Name): $($_.Trim())" }
          }
          if ($problemi) { $problemi; throw 'Il kit importa funzioni non disponibili su Windows 10 1607' }
          'Nessuna funzione incompatibile importata.'

      - name: Pubblica il kit
        uses: actions/upload-artifact@v5
        with:
          name: kit-R530
          path: kit-R530
          retention-days: 90

      - name: Prova del kit su questo server (30 s)
        run: |
          powershell -ExecutionPolicy Bypass -File kit-R530/esegui_prove.ps1 -Cartella "$env:RUNNER_TEMP/prove" -Secondi 30
          $r = Get-Content kit-R530/rapporto_prove.txt
          Move-Item kit-R530/rapporto_prove.txt rapporto_prove_ci.txt
          # Il server di GitHub ha 4 thread: non regge 4 codifiche XDCAM in tempo reale.
          # Qui bloccano solo le prove funzionali; registrazione in tempo reale, flusso completo,
          # velocita' 2x/3x e disco sono prove di prestazioni e contano solo sulla macchina vera.
          $funzionali = 'Logica di base', 'Riproduzione'
          $falliti = $r | Where-Object { $l = $_; ($funzionali | Where-Object { $l.StartsWith($_) }) -and $l -match 'FALLITO' }
          if ($falliti) { $falliti; throw 'Prove funzionali fallite' }

      - name: Pubblica il rapporto della prova
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rapporto-prove-ci
          path: rapporto_prove_ci.txt
          if-no-files-found: ignore
